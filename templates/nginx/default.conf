# Default nginx server block example for a local static site.
#
# Usage:
#   1. Ubuntu: copy into /etc/nginx/sites-available/<name> and symlink it into
#      /etc/nginx/sites-enabled/. Fedora: use /etc/nginx/conf.d/<name>.conf.
#   2. Adjust `server_name` and `root`
#   3. Fedora: serve from a directory with suitable permissions and SELinux
#      labels (for example /usr/share/nginx/html) when enabling this example.
#   4. Validate with: sudo nginx -t
#   5. Reload with: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name example.local;

    root /home/YOUR_USER/workspace/apps/example/public;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/example.access.log;
    error_log  /var/log/nginx/example.error.log;
}
